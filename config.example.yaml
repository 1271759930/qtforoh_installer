# Example configuration file
# Copy this file to config.yaml and modify as needed

install:
  # Qt source code path (tqtc-qt5)
  qt_source_path: "D:/code/tqtc-qt5"
  
  # HarmonyOS SDK path
  # Example: C:/Users/<username>/Library/OpenHarmony/Sdk/12
  harmony_sdk_path: "C:/Users/Administrator/Library/OpenHarmony/Sdk/12"
  
  # Qt installation path
  # Where the compiled Qt will be installed
  install_path: "C:/Qt/Qt5.15.16-HarmonyOS"
  
  # Target architecture
  # Options: arm64-v8a (recommended), x86_64
  architecture: "arm64-v8a"
  
  # Qt version
  qt_version: "5.15.16"
  
  # Build type
  # Options: release, debug, release-with-debug-info
  build_type: "release"
  
  # Number of parallel build jobs
  # Recommended: number of CPU cores
  parallel_jobs: 8

  # Python path (optional)
  # If you need a specific Python version for QML compilation, specify here
  # Leave as null to use system Python
  python_path: null  # Example: "C:/Python312/python.exe"

  # Modules to skip (reduce build time)
  skip_modules:
    - qt3d
    - qtactiveqt
    - qtandroidextras
    - qtcanvas3d
    - qtconnectivity
    - qtdatavis3d
    - qtdoc
    - qtdocgallery
    - qtfeedback
    - qtgamepad
    - qtgraphicaleffects
    - qtlocation
    - qtmacextras
    - qtnetworkauth
    - qtpim
    - qtpurchasing
    - qtqa
    - qtremoteobjects
    - qtrepotools
    - qtscript
    - qtscxml
    - qtsensors
    - qtserialbus
    - qtserialport
    - qtspeech
    - qtsystems
    - qttools
    - qttranslations
    - qtvirtualkeyboard
    - qtwayland
    - qtwebchannel
    - qtwebengine
    - qtwebglplugin
    - qtwebsockets
    - qtwebview
    - qtwinextras
    - qtx11extras
    - doc

# Note: Build tools (llvm-mingw, Perl) are bundled in the tools/ directory
# Run 'python scripts/download_tools.py' to download them before first use